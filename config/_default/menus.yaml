# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /#bio
    weight: 10
  - name: Publications
    url: /#papers
    weight: 20
  - name: Research
    url: /#research
    weight: 30
  - name: Experience
    url: /#experience
    weight: 40
  - name: Skills
    url: /#skills
    weight: 50
  - name: Service
    url: /#service
    weight: 60
