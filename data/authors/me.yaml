bio: |-
  I develop and evaluate machine learning methods for biomedical and clinical data, focusing on disease risk prediction, patient stratification, and disease progression. My work includes large-scale phenotyping, multi-omics analysis, and medical language model evaluation.

  I independently developed, built, and evaluated ukbFound (npj Digital Medicine, 2026), for which I am a co-first author. I also contributed to data acquisition, curation, and analysis for a medical language model study (Cell Reports Medicine, 2026).

  I earned my PhD in Biomedical Engineering from Peking Union Medical College in June 2026. The degree certificate bears the signatures of the presidents of Peking Union Medical College and Tsinghua University.
