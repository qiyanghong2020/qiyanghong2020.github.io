bio: |-
  I develop and evaluate machine learning methods for biomedical and clinical data, focusing on disease risk prediction, patient stratification, and disease progression. My work includes large-scale phenotyping, multi-omics analysis, and medical language model evaluation.

  As a co-first author of ukbFound (npj Digital Medicine, 2026), I developed and evaluated a machine-learning model using deep phenotyping data from more than 500,000 UK Biobank participants. The study explored disease risk prediction and multimorbidity, and identified patient subgroups across 289 conditions.

  For our medical language model study (Cell Reports Medicine, 2026), I was a co-first author and contributed to data acquisition, curation, and analysis for evaluating collaborative language models on medical questions and clinical reasoning tasks. I also contributed to multi-omics studies integrating genetic, protein, metabolite, and clinical data to investigate COPD, molecular subtypes, and longitudinal lung function decline.

  I earned my PhD in Biomedical Engineering from Tsinghua University & Peking Union Medical College in June 2026. Previously, I worked as a Bioinformatics Supervisor at Berry Genomics.

  My technical work includes Python, PyTorch, statistical analysis, survival analysis, and reproducible data-analysis workflows.
