bio: |-
  I develop and evaluate machine learning methods for biomedical and clinical data, focusing on disease risk prediction, patient stratification, and disease progression. My work includes large-scale phenotyping, multi-omics analysis, and medical language model evaluation.

  I am a co-first author of ukbFound (npj Digital Medicine, 2026) and a medical language model study (Cell Reports Medicine, 2026). My contributions include model development and evaluation for ukbFound, and data acquisition, curation, and analysis for medical language model research.
